
name: Build Madarat Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
          accept-android-sdk-licenses: true

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          if [ -f gradlew ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f app/gradlew ]; then
            echo "dir=app" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Gradle wrapper not found."
            echo "Repository files:"
            find . -maxdepth 3 \
              \( -name gradlew -o -name settings.gradle \
              -o -name settings.gradle.kts \) -print
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Madarat-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
