
name: Build Rafiq Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Locate Gradle build
        id: locate
        shell: bash
        run: |
          if [ -f gradlew ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
          elif [ -f app/gradlew ]; then
            echo "dir=app" >> "$GITHUB_OUTPUT"
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "wrapper=false" >> "$GITHUB_OUTPUT"
          elif [ -f app/build.gradle ] || [ -f app/build.gradle.kts ]; then
            echo "dir=app" >> "$GITHUB_OUTPUT"
            echo "wrapper=false" >> "$GITHUB_OUTPUT"
          else
            echo "No Gradle build files found in expected locations."
            find . -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts -o -name gradlew \)
            exit 1
          fi

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          if [ "${{ steps.locate.outputs.wrapper }}" = "true" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "Gradle wrapper is missing; cannot safely select a Gradle version."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rafiq-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
